[package]
name = "alloy-monad-evm"
description = "Monad EVM implementation"
version = "0.3.0"
edition = "2021"
rust-version = "1.91"
authors = ["Haythem Sellami - Category Labs <hsellami@category.xyz>"]
license = "MIT"
homepage = "https://github.com/category-labs/alloy-monad-evm"
repository = "https://github.com/category-labs/alloy-monad-evm"
documentation = "https://docs.rs/alloy-monad-evm"
keywords = ["monad", "evm", "alloy", "ethereum", "blockchain"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"

[lints.rustdoc]
all = "warn"

[lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"
unnameable-types = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
option-if-let-else = "allow"
redundant-clone = "warn"

[dependencies]
alloy-evm = { version = "=0.33.2", default-features = false }
alloy-primitives = { version = "=1.5.2", default-features = false }
revm = { version = "=38.0.0", default-features = false }
monad-revm = { git = "https://github.com/category-labs/monad-revm.git", rev = "444c9aaf7a77be35ecde6aeafa87cc1500eba0fa", default-features = false }

[dev-dependencies]
test-case = "3"

# [patch.crates-io]
# monad-revm = { git = "https://github.com/category-labs/monad-revm.git", branch = "main" }

[features]
default = ["std", "memory_limit"]
std = [
    "alloy-primitives/std",
    "revm/std",
    "alloy-evm/std",
    "monad-revm/std",
]
memory_limit = ["monad-revm/memory_limit"]
asm-keccak = ["alloy-evm/asm-keccak", "alloy-primitives/asm-keccak", "revm/asm-keccak"]
